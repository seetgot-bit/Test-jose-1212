        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          _captcha: 'false',
          _template: 'table',
          _next: SITE_URL,
          _url: SITE_URL,
          website: SITE_URL,
          ...fields
        })
      });
      const data = await res.json().catch(() => ({}));
      const ok = data.success === true || data.success === 'true';
      if (!ok) {
        const msg = (data && data.message) || 'FormSubmit did not accept this inquiry.';
        const err = new Error(msg);

    function LightboxModal({ imageSrc, title, subtitle, onClose }) {
      if (!imageSrc) return null;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);

          return lines.map((line, idx) => {

            // Parse bold text **word**

            history.pushState(null, '', window.location.pathname);
          } catch (err) {
            window.location.hash = '#/';
          }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Universal Navigation Router
      const navigateTo = (view, targetId = null) => {
        setSolutionsMenuOpen(false);
        if (view === 'home') {
          setCurrentView('home');
          if (targetId) {
            window.location.hash = '#' + targetId;
            setTimeout(() => {
              const el = document.getElementById(targetId);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
              } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            }, 60);
          } else {
            handleLogoClick();
          }
        } else if (view === 'work-done') {
          setCurrentView('work-done');
          if (targetId) {
            window.location.hash = '#/work-done/' + targetId;
            setTimeout(() => {
              const el = document.getElementById(targetId);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
                el.classList.add('ring-2', 'ring-blue-500', 'ring-offset-4');
                setTimeout(() => el.classList.remove('ring-2', 'ring-blue-500', 'ring-offset-4'), 2500);
              } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            }, 90);
          } else {
            window.location.hash = '#/work-done';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      };

      // URL Hash Router
      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#/work-done')) {
            setCurrentView('work-done');
            const parts = hash.split('#/work-done/');
            if (parts[1]) {
              setTimeout(() => {
                const el = document.getElementById(parts[1]);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }, 100);
            }
          } else {
            setCurrentView('home');
            const cleanHash = hash.replace('#', '').replace('/', '');
            if (cleanHash && cleanHash !== '') {
              setTimeout(() => {
                const el = document.getElementById(cleanHash);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }, 100);
            }
          }
        };

        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const openFlyerLightbox = (src, title, subtitle = '') => {
        setLightbox({ open: true, src, title, subtitle });
      };

      const closeLightbox = () => {
        setLightbox({ open: false, src: '', title: '', subtitle: '' });
      };

      const handleOpenContactWithTier = (tierName, industryName) => {
        setFocusAiFace(tierName.includes('Level 1') || tierName.includes('Face'));
        setFocusFreeApp(tierName.includes('Free') || tierName.includes('CFC'));
        setPrefillTier(tierName);
        if (industryName) setPrefillIndustry(industryName);
        setPrefillMessage(`Hello Jose,\n\nI would like to discuss deploying ${tierName} for our team in ${industryName || 'our industry'}.\n\nPlease let me know your availability for a discovery call.`);
        navigateTo('home', 'contact');
      };

      const handleOpenContactWithProject = (projectTitle, projectId) => {
        setFocusAiFace(true);
        setFocusFreeApp(false);
        setPrefillTier('AI Face Verification & Custom App: ' + projectTitle);
        setPrefillMessage(
          `Hello Jose,\n\nI clicked "Request Similar App for Your Organization" after reviewing your live deployment of "${projectTitle}".\n\nCore Architecture Requested: AI Biometric Face Verification (1.00 Face Match Score & Anti-Buddy Punching).\n\nKey Requirements:\n- Target Industry / Organization: \n- Team / Field Staff Size: \n- Essential Features: AI Biometric Attendance, Photo Shift Checklists, Web Admin Portal\n- Preferred Timeline: 5-7 business days\n\nPlease contact me to discuss feasibility, demo, and deployment.`
        );
        navigateTo('home', 'contact');
      };

      const handleOpenContactWithFreeApp = (projectTitle, projectId) => {
        setFocusAiFace(false);
        setFocusFreeApp(true);
        setPrefillTier('Free App Access: ' + projectTitle);
        setPrefillMessage(
          `Hello Jose,\n\nI would like to request free access to "${projectTitle}" for our community/worship ministry.\n\nPlease share the direct app access link and instructions on how our team can install and use the app.\n\nThank you!`
        );
        navigateTo('home', 'contact');
      };

      return (
        <div className="min-h-screen flex flex-col bg-white">
          
          {/* Header - Clean, Minimalist & Uncluttered */}
          <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/70 transition-all">
            <div className="max-w-7xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Name */}
              <div
                onClick={handleLogoClick}
                className="flex items-center gap-2.5 group cursor-pointer select-none shrink-0"
                title="Return to Top · Proofly by Jose Rene Navarro"
              >
                <StudioLogoMark isPulsing={logoActive} />
                <div>
                  <div className="text-lg font-bold tracking-tight text-slate-950 group-hover:text-blue-600 transition-colors">
                    Proofly
                  </div>
                  <div className="text-[11px] text-slate-500 font-medium -mt-0.5">
                    by Jose Rene Navarro
                  </div>
                </div>
              </div>

              {/* Navigation Links - Balanced, clean and spacious */}
              <nav className="hidden md:flex items-center gap-8 text-xs font-semibold text-slate-600">
                <button
                  type="button"
                  onClick={() => navigateTo('home')}
                  className={`hover:text-blue-600 transition ${currentView === 'home' ? 'text-blue-600 font-bold' : ''}`}
                >
                  Overview
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('home', 'proofly-suite')}
                  className="hover:text-blue-600 transition"
                >
                  Proofly Levels
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('work-done')}
                  className={`hover:text-blue-600 transition flex items-center gap-1.5 ${currentView === 'work-done' ? 'text-blue-600 font-bold' : ''}`}
                >
                  <span>Work Done</span>
                  <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 font-normal">5 Apps</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('home', 'qa-terminal')}
                  className="hover:text-blue-600 transition"
                >
                  QA Rigor
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('home', 'about-founder')}
                  className="hover:text-blue-600 transition"
                >
                  About Jose
                </button>
              </nav>

              {/* Header Right Actions */}
              <div className="flex items-center gap-4 shrink-0">
                <a
                  href="tel:437-423-3456"
                  className="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 hover:text-blue-600 font-mono transition-colors"
                  title="Direct Phone Line to Jose Rene Navarro"
                >
                  <SvgIcon name="phone" className="w-3.5 h-3.5 text-blue-600" />
                  <span>(437) 423-3456</span>
                </a>
                <button
                  type="button"
                  onClick={() => navigateTo('home', 'contact')}
                  className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm hover:shadow transition-all cursor-pointer"
                >
                  Consultation
                </button>
              </div>
            </div>
          </header>

          {/* Main Content View Switcher */}
          <main className="flex-1">
            {currentView === 'work-done' ? (
              <WorkDonePage
                onOpenFlyer={openFlyerLightbox}
                onOpenContactWithProject={handleOpenContactWithProject}
                onOpenContactWithFreeApp={handleOpenContactWithFreeApp}
                onNavigate={navigateTo}
              />
            ) : (
              <React.Fragment>
                <section className="ambient-glow-top studio-dots pt-8 pb-16 px-5 sm:px-8">
                  <div className="max-w-7xl mx-auto">
                    <AppConfiguratorHero
                      onSelectTierFlyer={openFlyerLightbox}
                      onOpenContactWithTier={handleOpenContactWithTier}
                      onNavigate={navigateTo}
                    />
                  </div>
                </section>

                <CoreServicesSection onNavigate={navigateTo} />
                <PaperVsGlideSection />
                <ProoflyLevelsSection onOpenTierFlyer={openFlyerLightbox} onNavigate={navigateTo} />
                <QaTerminalSection />
                <PortfolioHomeSection
                  onOpenFlyer={openFlyerLightbox}
                  onOpenContactWithFreeApp={handleOpenContactWithFreeApp}
                  onNavigate={navigateTo}
                />
                <FounderSection />
                <FaqSection />
                <ContactSection
                  initialTier={prefillTier}
                  initialIndustry={prefillIndustry}
                  initialMessage={prefillMessage}
                  isAiFaceEmphasis={focusAiFace}
                  isFreeAppEmphasis={focusFreeApp}
                />
              </React.Fragment>
            )}
          </main>

          {/* Lightbox Flyer Modal */}
          {lightbox.open && (
            <LightboxModal
              imageSrc={lightbox.src}
              title={lightbox.title}
              subtitle={lightbox.subtitle}
              onClose={closeLightbox}
            />
          )}

          {/* Footer */}
          <footer className="bg-slate-950 text-white py-14 px-5 sm:px-8 border-t border-slate-800 text-xs">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 pb-10 border-b border-slate-800">
              <div className="space-y-3 md:col-span-2">
                <div
                  onClick={handleLogoClick}
                  className="flex items-center gap-3 cursor-pointer group logo-interactive-container select-none"
                  title="Return to top · Proofly"
                >
                  <StudioLogoMark size="lg" isPulsing={logoActive} />
                  <div>
                    <span className="font-bold text-xl tracking-tight text-white block font-heading group-hover:text-cyan-400 transition-colors">Proofly</span>
                    <span className="text-[11px] text-blue-400 font-mono uppercase tracking-wider">Solutions That Work · By Jose Rene Navarro</span>
                  </div>
                </div>
                <p className="text-slate-400 max-w-sm leading-relaxed">
                  AI-powered workforce management platform, custom mobile & web applications, and enterprise quality assurance testing — backed by 20+ years of software engineering rigor.
                </p>
                <div className="text-slate-500 font-mono text-[11px]">
                  Toronto, Ontario, Canada · (437) 423-3456 · dexter125555@gmail.com
                </div>
              </div>

              {/* Solutions & Work (Submenu / Deep Links) */}
              <div>
                <div className="font-bold text-slate-200 uppercase tracking-wider mb-3 font-mono">Solutions & Work</div>
                <ul className="space-y-2 text-slate-400">
                  {PROJECTS_DATA.map((proj) => (
                    <li key={proj.id}>
                      <button
                        type="button"
                        onClick={() => navigateTo('work-done', proj.id)}
                        className="hover:text-white transition text-left"
                      >
                        {proj.title} ({proj.activeMetric})
                      </button>
                    </li>
                  ))}
                  <li className="pt-1">
                    <button
                      type="button"
                      onClick={() => navigateTo('work-done')}
                      className="text-cyan-400 hover:underline font-semibold"
                    >
                      View All 5 Production Case Studies →
                    </button>
                  </li>
                </ul>
              </div>

              {/* Direct Contact */}
              <div>
                <div className="font-bold text-slate-200 uppercase tracking-wider mb-3 font-mono">Direct Contact</div>
                <ul className="space-y-2 text-slate-400">
                  <li><a href="tel:437-423-3456" className="text-blue-400 hover:underline font-mono">📞 (437) 423-3456</a></li>
                  <li><a href="mailto:dexter125555@gmail.com" className="hover:text-white font-mono">✉️ dexter125555@gmail.com</a></li>
                  <li><a href="https://www.linkedin.com/in/jose-navarro-93b31015/" target="_blank" rel="noopener noreferrer" className="hover:text-blue-400">🔗 LinkedIn Profile</a></li>
                  <li><span className="text-slate-500 font-mono">joserenenavarro.blog · my-mobileapps.com</span></li>
                </ul>
              </div>
            </div>

            <div className="max-w-7xl mx-auto pt-6 flex flex-col sm:flex-row items-center justify-between text-slate-500 text-[11px] gap-2">
              <span>© 2026 Proofly / Jose Rene Navarro. All rights reserved.</span>
              <span>Solutions That Work · Built on Glide Mobile & Web with 20+ Yrs QA</span>
            </div>
          </footer>

          {/* Proofly AI Concierge Interactive Chatbot (100% Free Forever) */}
          <AiChatbotWidget onNavigate={navigateTo} />

        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
